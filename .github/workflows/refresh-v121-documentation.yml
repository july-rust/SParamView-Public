name: Retired v1.2.1 documentation refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve published releases
        run: |
          echo 'The one-time v1.2.1 package refresh is retired.'
          echo 'Published tags and assets are immutable. Documentation or package changes require a new version.'
