# Independent CodeQL analysis. Keep the existing multi-platform build/test CI unchanged.
# GitHub's main branch has a separate CodeQL Advanced workflow for C/C++, Python,
# and Actions. Keep this workflow specific to the integration branch to avoid
# duplicate CodeQL C/C++ uploads when the integration branch reaches main.
name: CodeQL C++ security and quality

on:
  push:
    branches:
      - integration/v1.4.0
  pull_request:
    branches:
      - integration/v1.4.0

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql-cpp:
    name: CodeQL (C/C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # C/C++ supports buildless extraction; avoid rebuilding Qt and the
      # three platform release matrices solely for a security scan.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          queries: security-and-quality

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
