name: COM 012_33 native Windows ARM64 physical contract

on:
  pull_request:
    branches: [integration/v1.4.0]
    paths:
      - 'CMakeLists.txt'
      - 'include/si/channel_analysis/**'
      - 'src/channel_analysis/**'
      - 'tests/channel_analysis/com_physical_contract_012_33_tests.cpp'
      - 'tests/channel_analysis/com_fixed_victim_012_34_tests.cpp'
      - 'tests/channel_analysis/com_fixed_crosstalk_012_35_tests.cpp'
      - 'tests/channel_analysis/com_fixed_noise_012_36_tests.cpp'
      - 'tests/channel_analysis/com_fixed_fom_012_37_tests.cpp'
      - 'tests/channel_analysis/com_fixed_tail_012_38_tests.cpp'
      - 'tests/channel_analysis/com_fixed_ratio_012_39_tests.cpp'
      - '.github/workflows/com-01233-native-arm64.yml'
  push:
    branches: [integration/v1.4.0]
    paths:
      - 'CMakeLists.txt'
      - 'include/si/channel_analysis/**'
      - 'src/channel_analysis/**'
      - 'tests/channel_analysis/com_physical_contract_012_33_tests.cpp'
      - 'tests/channel_analysis/com_fixed_victim_012_34_tests.cpp'
      - 'tests/channel_analysis/com_fixed_crosstalk_012_35_tests.cpp'
      - 'tests/channel_analysis/com_fixed_noise_012_36_tests.cpp'
      - 'tests/channel_analysis/com_fixed_fom_012_37_tests.cpp'
      - 'tests/channel_analysis/com_fixed_tail_012_38_tests.cpp'
      - 'tests/channel_analysis/com_fixed_ratio_012_39_tests.cpp'
      - '.github/workflows/com-01233-native-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-arm64-01233:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Prove native ARM64 host and toolchain
        shell: pwsh
        run: |
          Write-Host "Runner architecture: $env:RUNNER_ARCH"
          Write-Host "Processor architecture: $env:PROCESSOR_ARCHITECTURE"
          if ($env:RUNNER_ARCH -ne 'ARM64') {
            throw 'Not a native Windows ARM64 GitHub runner'
          }
          cmake --version
          $ErrorActionPreference = 'Stop'
      - name: Configure native Qt-free 012_33 test
        shell: pwsh
        run: |
          cmake -S . -B build-01233-arm64 -G "Visual Studio 18 2026" -A ARM64 -DSI_BUILD_GUI=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile native ARM64 C++ numeric contract
        shell: pwsh
        run: |
          cmake --build build-01233-arm64 --config Release --target si_com_physical_contract_012_33_tests si_com_fixed_victim_012_34_tests si_com_fixed_crosstalk_012_35_tests si_com_fixed_noise_012_36_tests si_com_fixed_fom_012_37_tests si_com_fixed_tail_012_38_tests si_com_fixed_ratio_012_39_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute native ARM64 independent complex Golden and negative tests
        shell: pwsh
        run: |
          ctest --test-dir build-01233-arm64 -C Release --output-on-failure -R "^channel_com_(012_(33_physical_contract|34_fixed_victim|35_fixed_crosstalk)|fixed_eq_noise_jitter|fixed_eq_fom|fixed_eq_der_tail|fixed_eq_ratio)$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
