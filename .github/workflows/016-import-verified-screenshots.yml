# Temporary one-shot transfer of already visually inspected synthetic QA images.
# Never runs on main, never reads private Touchstone data, never publishes a release.
name: 016 import verified screenshots
on:
  push:
    branches: [fix/016-auto-manual-eye]
    paths: [.github/workflows/016-import-verified-screenshots.yml]
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.repository == 'july-rust/SParamView-Public' && github.ref == 'refs/heads/fix/016-auto-manual-eye'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download exact previously inspected native CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 46136603711 --repo july-rust/SParamView-Public --name SParamView-v1.4.3-Native-Windows-ARM64-validation --dir "$RUNNER_TEMP/016-evidence"
          cd "$RUNNER_TEMP/016-evidence/analysis-screenshots"
          sha256sum -c <<'HASHES'
          46ed8aa5a960cfcdce7dfaad96274faa456ebafdbf4522115c1ef65349a64bd1  04_ILD.png
          7f43842a3800b63dd0296f3ef9c5260bb1feb7f32a8966099a2c8f51f5d62137  05_ICN.png
          484446ad41f886959ec5fec10e4f31d38febe1651f54dce3f3fbc10ed9896702  06_Eye_Multi_View.png
          HASHES
          cp 04_ILD.png 05_ICN.png 06_Eye_Multi_View.png "$GITHUB_WORKSPACE/docs/images/"
      - name: Commit only the three verified PNG files to the candidate branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/images/04_ILD.png docs/images/05_ICN.png docs/images/06_Eye_Multi_View.png
          git diff --cached --stat
          git commit -m '016: import SHA-256 verified v1.4.3 native GUI screenshots'
          git push origin HEAD:refs/heads/fix/016-auto-manual-eye
