name: SParamView native workspace diagnostic
on:
  push:
    branches: ['release/v1.2.4']
    paths: ['tests/workspace_tests.cpp', '.github/workflows/workspace-diagnostic.yml']
permissions:
  contents: read
env:
  QT_VERSION: '6.8.3'
jobs:
  macos-arm64:
    name: macOS Apple Silicon arm64
    runs-on: macos-14
    timeout-minutes: 12
    env:
      QT_ROOT: ${{ github.workspace }}/Qt/6.8.3/macos
      MACOS_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt/6.8.3
          key: qt-macos-arm64-${{ env.QT_VERSION }}-v1

      - name: Install Qt download tooling
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check aqtinstall==3.3.0

      - name: Install Qt for macOS
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "${{ github.workspace }}/Qt"

      - name: Configure Apple Silicon build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT/lib/cmake" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"

      - name: Build Apple Silicon binaries
        run: cmake --build build-macos --parallel 3 --target si_workspace_tests

      - name: Execute native workspace with bounded runtime
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['build-macos/si_workspace_tests', 'examples/demo.siproject',
                          'build-macos/workspace-test-macos', '1440', '900'],
                         check=True, timeout=120)
          PY
      - name: Preserve workspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-workspace-diagnostic
          path: build-macos/workspace-test-macos/
          if-no-files-found: warn
          retention-days: 7
