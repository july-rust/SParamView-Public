name: Publish validated user-guide screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-user-guide-screenshots.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated v1.1.5 UI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11073037875/zip > /tmp/validation.zip
          rm -rf /tmp/sparamview-validation
          mkdir -p /tmp/sparamview-validation docs/images
          unzip -q /tmp/validation.zip -d /tmp/sparamview-validation
          cp /tmp/sparamview-validation/workflow/SParamView_screen.png docs/images/01_Main_Window.png
          cp /tmp/sparamview-validation/open/mapping.png docs/images/02_Channel_Mapping.png
          cp /tmp/sparamview-validation/workflow/SParamView_graph.png docs/images/03_RL_Analysis_Graph.png

      - name: Add screenshots to Korean and English guides
        shell: python
        run: |
          from pathlib import Path

          def insert_after(path, anchor, addition, marker):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'Anchor not found in {path}: {anchor!r}')
              text = text.replace(anchor, anchor + addition, 1)
              p.write_text(text, encoding='utf-8')

          ko = 'docs/USER_GUIDE_KO.md'
          en = 'docs/USER_GUIDE_EN.md'

          insert_after(
              ko,
              '## 4. 메인 화면 구성\n\n',
              '> **자동 검증 화면** — 아래 이미지는 SParamView v1.1.5 네이티브 Windows ARM64 검증에서 synthetic sample project를 사용해 프로그램이 자동 생성한 화면입니다. OS, DPI 및 창 크기에 따라 실제 배치는 조금 달라질 수 있습니다.\n\n![SParamView v1.1.5 메인 화면](images/01_Main_Window.png)\n\n',
              'images/01_Main_Window.png')

          insert_after(
              en,
              '## 4. Main Window\n\n',
              '> **Automated validation screenshot** — The image below was generated automatically by SParamView v1.1.5 during native Windows ARM64 validation using the synthetic sample project. Layout can vary slightly with OS, DPI, and window size.\n\n![SParamView v1.1.5 main window](images/01_Main_Window.png)\n\n',
              'images/01_Main_Window.png')

          insert_after(
              ko,
              '## 6. Channel Mapping\n\n',
              '아래 화면은 자동 매핑을 확정할 수 없는 입력을 검증하는 테스트에서 SParamView가 자동 생성한 Channel Mapping 창입니다. 이런 경우 포트 관계를 확인한 뒤 수동 매핑 또는 Mapping CSV로 확정할 수 있습니다.\n\n![SParamView Channel Mapping 화면](images/02_Channel_Mapping.png)\n\n',
              'images/02_Channel_Mapping.png')

          insert_after(
              en,
              '## 6. Channel Mapping\n\n',
              'The following dialog was generated automatically during a validation case where mapping could not be confirmed from the input alone. In this situation, verify the physical port relationships and confirm them manually or with a Mapping CSV.\n\n![SParamView Channel Mapping dialog](images/02_Channel_Mapping.png)\n\n',
              'images/02_Channel_Mapping.png')

          ko_rl = 'SParamView는 RL 결과를 Single-ended에서는 **S11**, Differential에서는 **Sdd11** 표기와 함께 사용합니다. 현재 Limit 입력은 `≤` 조건입니다. 예를 들어 Limit이 `-10 dB`라면 `-10 dB 이하`의 값이 기준을 만족합니다.\n\n'
          insert_after(
              ko,
              ko_rl,
              '아래 자동 검증 그래프는 synthetic differential sample의 **Sdd11 Return Loss** 예시입니다. 붉은 점선은 활성 Limit이고, 각 trace의 Worst point와 OK/NG 상태를 함께 확인할 수 있습니다.\n\n![Sdd11 Return Loss 자동 검증 그래프](images/03_RL_Analysis_Graph.png)\n\n',
              'images/03_RL_Analysis_Graph.png')

          en_rl = 'SParamView uses RL together with **S11** for single-ended data and **Sdd11** for differential data where applicable. The current limit relation is `≤`. For example, with a `-10 dB` limit, values at or below `-10 dB` satisfy the limit.\n\n'
          insert_after(
              en,
              en_rl,
              'The automatically generated validation plot below shows an **Sdd11 Return Loss** example using synthetic differential sample data. The red dashed line is the enabled limit, and the plot shows worst points together with OK/NG status.\n\n![Automated Sdd11 Return Loss validation plot](images/03_RL_Analysis_Graph.png)\n\n',
              'images/03_RL_Analysis_Graph.png')

      - name: Record screenshot provenance
        run: |
          cat > docs/images/README.md <<'EOF'
          # User-guide screenshot provenance

          These screenshots are generated by SParamView's automated validation workflow and use synthetic demonstration data, not real product measurement data.

          Source release: SParamView v1.1.5
          Source commit: db95ebc3b3aed4651e18296540f0a011a1e16bc7
          Source workflow run: 36656502116
          Source artifact: SParamView-v1.1.5-Native-Windows-ARM64-validation (artifact ID 11073037875)

          Files:
          - `01_Main_Window.png` <- `workflow/SParamView_screen.png`
          - `02_Channel_Mapping.png` <- `open/mapping.png`
          - `03_RL_Analysis_Graph.png` <- `workflow/SParamView_graph.png`

          The screenshots are documentation examples. Small visual differences can occur across operating systems, DPI settings, fonts, and later SParamView releases.
          EOF

      - name: Commit documentation screenshots
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/USER_GUIDE_KO.md docs/USER_GUIDE_EN.md docs/images
          git rm .github/workflows/publish-user-guide-screenshots.yml
          git commit -m 'docs: add validated UI screenshots to user guides'
          git push
