              'windows_arm64_native_packaged_binary_regression': 'PASS',
              'macos_apple_silicon_native_build_and_tests': 'PASS',
          }
          with open(f'SParamView_v{version}_Release_Status_FINAL.json','w',encoding='utf-8') as f:
