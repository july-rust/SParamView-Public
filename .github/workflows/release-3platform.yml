      - name: Create or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "SParamView_Windows_x64_v${SPARAMVIEW_VERSION}.zip"
            "SParamView_Windows_x64_v${SPARAMVIEW_VERSION}.zip.sha256"
            "SParamView_Windows_ARM64_v${SPARAMVIEW_VERSION}.zip"
            "SParamView_Windows_ARM64_v${SPARAMVIEW_VERSION}.zip.sha256"
            "package/macos/SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.zip"
            "package/macos/SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.zip.sha256"
            "package/macos/SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.dmg"
            "package/macos/SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.dmg.sha256"
            "SParamView_v${SPARAMVIEW_VERSION}_Release_Status_FINAL.json"
          )
          if gh release view "v${SPARAMVIEW_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${SPARAMVIEW_VERSION}" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "v${SPARAMVIEW_VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SParamView v${SPARAMVIEW_VERSION} — Windows x64 + Windows ARM64 + macOS Apple Silicon" \
              --notes-file "docs/Release_${SPARAMVIEW_VERSION}.md" \
              "${assets[@]}"
          fi
