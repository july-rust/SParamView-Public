name: SParamView three-platform CI and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'docs/Release_*.md'
      - '.github/workflows/release-3platform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'docs/Release_*.md'
      - '.github/workflows/release-3platform.yml'

permissions:
  contents: read

concurrency:
  group: three-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  QT_VERSION: '6.8.3'

jobs:
  prepare:
    name: Version and release consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify version consistency
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re

          core = pathlib.Path('include/si/core.hpp').read_text(encoding='utf-8')
          cmake = pathlib.Path('CMakeLists.txt').read_text(encoding='utf-8')
          rc = pathlib.Path('assets/SParamView.rc').read_text(encoding='utf-8')

          def match(pattern, text, label):
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit(f'Cannot determine {label} version')
              return m.group(1)

          core_v = match(r'inline constexpr const char \*version = "([0-9]+\.[0-9]+\.[0-9]+[a-z]?)"', core, 'core')
          cmake_v = match(r'project\(SParamView VERSION ([0-9]+\.[0-9]+\.[0-9]+)', cmake, 'CMake')
          rc_v = match(r'VALUE "ProductVersion", "([0-9]+\.[0-9]+\.[0-9]+[a-z]?)\\0"', rc, 'Windows resource')
          # CMake and CFBundleShortVersionString require a numeric base version.
          if core_v != '1.2.4a' or cmake_v != '1.2.4' or rc_v != core_v:
              raise SystemExit(f'Version mismatch: core={core_v}, cmake={cmake_v}, rc={rc_v}')
          notes = pathlib.Path(f'docs/Release_{core_v}.md')
          if not notes.is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          print(f'version={core_v}')
          PY

      - name: Summary
        run: echo "SParamView v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Core quality gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure and build common core
        run: cmake -S . -B build-core -DSI_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build common core
        run: cmake --build build-core --parallel 2

      - name: Run common regression tests
        run: ctest --test-dir build-core --output-on-failure

      - name: Configure sanitizer build
        run: cmake -S . -B build-san -DSI_BUILD_GUI=OFF -DSI_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build sanitizer targets
        run: cmake --build build-san --parallel 2

      - name: Run ASan and UBSan regression tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

      - name: Configure clang-tidy compilation database
        run: cmake -S . -B build-tidy -DSI_BUILD_GUI=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang analyzer checks
        run: clang-tidy src/core.cpp -p build-tidy --checks='-*,clang-analyzer-*' --warnings-as-errors='clang-analyzer-*'

      - name: Upload core test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-core-validation
          path: |
            build-core/Testing/Temporary/*.log
            build-san/Testing/Temporary/*.log
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}

  windows:
    name: Windows ${{ matrix.arch }}
    needs: [prepare, quality]
    runs-on: windows-2022
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            qt_root: C:/Qt/6.8.3/msvc2022_64
            validation_dir: validation-windows-x64
          - arch: ARM64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            qt_root: C:/Qt/6.8.3/msvc2022_arm64
            validation_dir: validation-windows-arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Qt ${{ matrix.arch }} kit
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: C:/Qt/6.8.3
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ matrix.arch }}-v1

      - name: Install Qt download tooling
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check aqtinstall==3.3.0

      - name: Install Qt x64 kit
        if: steps.qt-cache.outputs.cache-hit != 'true' && matrix.arch == 'x64'
        run: python -m aqt install-qt windows desktop $env:QT_VERSION ${{ matrix.qt_arch }} -O C:/Qt

      - name: Install Qt ARM64 target and x64 host kits
        if: steps.qt-cache.outputs.cache-hit != 'true' && matrix.arch == 'ARM64'
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:/Qt
          if ($LASTEXITCODE -ne 0) { throw 'Qt x64 host installation failed' }
          python -m aqt install-qt windows desktop $env:QT_VERSION ${{ matrix.qt_arch }} -O C:/Qt
          if ($LASTEXITCODE -ne 0) { throw 'Qt ARM64 target installation failed' }

      - name: Install PE validation dependency
        run: python -m pip install --disable-pip-version-check pefile==2024.8.26

      - name: Build, test, deploy and audit x64
        if: matrix.arch == 'x64'
        run: |
          ./scripts/build_windows.ps1 `
            -QtRoot '${{ matrix.qt_root }}' `
            -Compiler MSVC `
            -Architecture x64

      - name: Cross-build, deploy and audit ARM64
        if: matrix.arch == 'ARM64'
        run: |
          ./scripts/build_windows.ps1 `
            -QtRoot '${{ matrix.qt_root }}' `
            -HostQtRoot 'C:/Qt/6.8.3/msvc2022_64' `
            -Compiler MSVC `
            -Architecture ARM64 `
            -SkipTests

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-${{ matrix.arch }}-validation
          path: ${{ matrix.validation_dir }}/
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}
          compression-level: 9

      - name: Record bundle build provenance
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          @{version=$env:SPARAMVIEW_VERSION;commit=$env:GITHUB_SHA;platform='Windows ${{ matrix.arch }}';run_id=$env:GITHUB_RUN_ID} |
            ConvertTo-Json | Set-Content -Encoding utf8 'dist/SParamView-Windows-${{ matrix.arch }}/build-provenance.json'

      - name: Upload runnable Windows bundle
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Windows-${{ matrix.arch }}
          path: dist/SParamView-Windows-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}
          compression-level: 6

  windows-arm64-native:
    name: Native Windows ARM64 packaged-binary gate
    needs: [prepare, windows]
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download ARM64 bundle
        uses: actions/download-artifact@v7
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Windows-ARM64
          path: bundle

      - name: Verify native architecture and executable metadata
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne 'Arm64') { throw "Native ARM64 gate requires Arm64, got $arch" }
          $app = Join-Path $PWD 'bundle\SParamView.exe'
          if (-not (Test-Path $app)) { throw 'SParamView.exe missing from ARM64 bundle' }
          $v = (Get-Item $app).VersionInfo
          $expected = '^(?:' + [regex]::Escape($env:SPARAMVIEW_VERSION) + '|1\.2\.4\.1)
          if ($v.ProductVersion -notmatch $expected) { throw "ProductVersion mismatch: $($v.ProductVersion)" }
          if ($v.FileVersion -notmatch $expected) { throw "FileVersion mismatch: $($v.FileVersion)" }
          if ($v.LegalCopyright -ne 'Copyright © 2026 july') { throw "LegalCopyright mismatch: $($v.LegalCopyright)" }

      - name: Run packaged ARM64 regression suite natively
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bundle = Join-Path $PWD 'bundle'
          $qa = Join-Path $env:RUNNER_TEMP ('native-arm64-v' + $env:SPARAMVIEW_VERSION)
          New-Item -ItemType Directory -Force $qa | Out-Null
          $env:PATH = $bundle + [IO.Path]::PathSeparator + $env:PATH
          $env:QT_PLUGIN_PATH = $bundle
          $env:QT_QPA_PLATFORM = 'offscreen'
          $log = Join-Path $qa 'results.txt'
          "SParamView v$env:SPARAMVIEW_VERSION native Windows ARM64 packaged-binary gate" | Set-Content $log
          function Invoke-Test {
            param([string]$Name, [string[]]$TestArgs = @())
            $exe = Join-Path $bundle ($Name + '.exe')
            if (-not (Test-Path $exe)) { throw "Missing test executable: $Name" }
            "--- $Name $($TestArgs -join ' ')" | Add-Content $log
            & $exe @TestArgs 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "$Name failed with exit code $LASTEXITCODE" }
          }
          foreach ($name in @('si_tests','si_v116_regression_tests','si_v121_regression_tests','si_algorithm_regression_tests','si_mapping_tests','si_mapping_policy_tests','si_polarity_tests','si_termination_tests','si_performance_tests','si_qt_tests','si_header_ui_tests')) {
            Invoke-Test -Name $name
          }
          foreach ($case in @('named','options','triangle','hash','numbers')) {
            Invoke-Test -Name 'si_v124_regression_tests' -TestArgs @($case)
          }
          foreach ($case in @('reuse','dirty','project_changed','single_review','mixed','transition','roundtrip')) {
            Invoke-Test -Name 'si_v124_gui_tests' -TestArgs @($case,(Join-Path $qa "v124-$case"))
          }
          Invoke-Test -Name 'si_direction_tests' -TestArgs @((Join-Path $qa 'direction'))
          Invoke-Test -Name 'si_golden_tests' -TestArgs @((Join-Path $qa 'golden'))
          foreach ($case in @('snapshot','cr_only','false_noise','valid_noise','empty_tdr','truncated_live_cache','invalid_cached_frequency','zero_transfer','cancel_reopen','parallel_import')) {
            Invoke-Test -Name 'si_hardening_tests' -TestArgs @($case,(Join-Path $qa "hardening\$case"))
          }
          Invoke-Test -Name 'si_navigation_tests' -TestArgs @((Join-Path $qa 'navigation'))
          Invoke-Test -Name 'si_open_tests' -TestArgs @((Join-Path $qa 'open'),'fallback')
          Invoke-Test -Name 'si_open_tests' -TestArgs @((Join-Path $qa 'signal-type'),'signaltype')
          Invoke-Test -Name 'si_workspace_tests' -TestArgs @((Join-Path $bundle 'examples\demo.siproject'),(Join-Path $qa 'workspace'),'1366','768')
          & (Join-Path $bundle 'SParamView.exe') --selftest (Join-Path $bundle 'examples') (Join-Path $qa 'workflow') 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "SParamView.exe --selftest failed with exit code $LASTEXITCODE" }
          'PASS' | Add-Content $log

      - name: Upload native ARM64 validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Native-Windows-ARM64-validation
          path: ${{ runner.temp }}/native-arm64-v${{ needs.prepare.outputs.version }}/
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}
          compression-level: 9

  macos-arm64:
    name: macOS Apple Silicon arm64
    needs: [prepare, quality]
    runs-on: macos-14
    timeout-minutes: 70
    env:
      QT_ROOT: ${{ github.workspace }}/Qt/6.8.3/macos
      MACOS_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/Qt/6.8.3
          key: qt-macos-arm64-${{ env.QT_VERSION }}-v1

      - name: Install Qt download tooling
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check aqtinstall==3.3.0

      - name: Install Qt for macOS
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "${{ github.workspace }}/Qt"

      - name: Configure Apple Silicon build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT/lib/cmake" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"

      - name: Build Apple Silicon binaries
        run: cmake --build build-macos --parallel 3

      - name: Verify application executable architecture
        shell: bash
        run: |
          set -euo pipefail
          arches="$(lipo -archs build-macos/SParamView)"
          echo "SParamView architectures: $arches"
          grep -qw arm64 <<<"$arches"
          if grep -qw x86_64 <<<"$arches"; then
            echo 'Unexpected x86_64 slice in Apple Silicon executable'
            exit 1
          fi

      - name: Run deterministic regression suite
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-macos --output-on-failure \
            -E 'workspace_layout|navigation_responsiveness|mapping_fallback_gui|signal_type_detection_gui'

      - name: Run macOS GUI integration tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=minimal build-macos/si_header_ui_tests
          QT_QPA_PLATFORM=minimal build-macos/si_navigation_tests build-macos/navigation-test-macos
          QT_QPA_PLATFORM=minimal build-macos/si_open_tests build-macos/open-test-macos fallback
          QT_QPA_PLATFORM=cocoa build-macos/si_workspace_tests examples/demo.siproject build-macos/workspace-test-macos 1440 900
          QT_QPA_PLATFORM=minimal build-macos/si_open_tests build-macos/signal-type-test-macos signaltype

      - name: Create macOS app bundle
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          app='package/SParamView.app'
          mkdir -p "$app/Contents/MacOS/fonts" "$app/Contents/Resources"
          cp build-macos/SParamView "$app/Contents/MacOS/SParamView"
          cp -R assets/fonts/. "$app/Contents/MacOS/fonts/"

          iconset="${RUNNER_TEMP}/SParamView.iconset"
          iconpng="${RUNNER_TEMP}/SParamView-icon.png"
          rm -rf "$iconset" "$iconpng"
          mkdir -p "$iconset"
          sips -s format png assets/SParamView.ico --out "$iconpng" >/dev/null
          sips -z 16 16 "$iconpng" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 "$iconpng" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$iconpng" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 "$iconpng" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$iconpng" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 "$iconpng" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$iconpng" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 "$iconpng" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$iconpng" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$iconpng" --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/SParamView.icns"
          test -s "$app/Contents/Resources/SParamView.icns"
          rm -rf "$iconset" "$iconpng"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleDisplayName</key><string>SParamView</string>
            <key>CFBundleExecutable</key><string>SParamView</string>
            <key>CFBundleIconFile</key><string>SParamView.icns</string>
            <key>CFBundleIdentifier</key><string>com.july.sparamview</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>SParamView</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.2.4</string>
            <key>CFBundleVersion</key><string>1.2.4.1</string>
            <key>SParamViewDisplayVersion</key><string>${SPARAMVIEW_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>${MACOS_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          "$QT_ROOT/bin/macdeployqt" "$app" -always-overwrite -verbose=2
          test -s "$app/Contents/Resources/SParamView.icns"
          test "$(plutil -extract CFBundleIconFile raw -o - "$app/Contents/Info.plist")" = 'SParamView.icns'

      - name: Thin and audit deployed Mach-O files to arm64
        shell: bash
        run: |
          set -euo pipefail
          app='package/SParamView.app'
          count=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              count=$((count + 1))
              arches="$(lipo -archs "$f")"
              if ! grep -qw arm64 <<<"$arches"; then
                echo "ERROR: missing arm64 slice: $f :: $arches"
                exit 1
              fi
              if grep -qw x86_64 <<<"$arches"; then
                lipo "$f" -thin arm64 -output "$f.arm64"
                mv "$f.arm64" "$f"
              fi
              final="$(lipo -archs "$f")"
              echo "$f :: $final"
              test "$final" = 'arm64'
            fi
          done < <(find "$app/Contents" -type f -print0)
          test "$count" -gt 0

      - name: Record macOS build provenance
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, plistlib
          app=pathlib.Path('package/SParamView.app/Contents')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']=='1.2.4'
          assert info['CFBundleVersion']=='1.2.4.1'
          assert info['SParamViewDisplayVersion']==os.environ['SPARAMVIEW_VERSION']
          (app/'Resources/build-provenance.json').write_text(json.dumps(dict(version=os.environ['SPARAMVIEW_VERSION'],commit=os.environ['GITHUB_SHA'],platform='macOS arm64',run_id=os.environ['GITHUB_RUN_ID'])))
          PYTHON

      - name: Ad-hoc sign and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          app='package/SParamView.app'
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Run packaged application self-test
        shell: bash
        env:
          QT_QPA_PLATFORM: minimal
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QT_ROOT }}/plugins/platforms
        run: |
          set -euo pipefail
          mkdir -p package/selftest
          package/SParamView.app/Contents/MacOS/SParamView --selftest examples package/selftest

      - name: Include release documentation in macOS bundle
        run: |
          mkdir -p package/SParamView.app/Contents/Resources/docs
          cp README_FIRST.txt package/SParamView.app/Contents/Resources/
          cp docs/USER_GUIDE_*.md docs/Release_${{ needs.prepare.outputs.version }}.md package/SParamView.app/Contents/Resources/docs/
          codesign --force --deep --sign - package/SParamView.app
          codesign --verify --deep --strict package/SParamView.app

      - name: Upload macOS test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-macOS-validation
          path: |
            build-macos/Testing/Temporary/*.log
            build-macos/workspace-test-macos/*.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}

      - name: Package Apple Silicon ZIP and DMG
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          zipname="SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.zip"
          dmgname="SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.dmg"
          ditto -c -k --sequesterRsrc --keepParent package/SParamView.app "$zipname"
          rm -rf dmg-root && mkdir dmg-root
          cp -R package/SParamView.app dmg-root/
          hdiutil create -volname "SParamView ${SPARAMVIEW_VERSION}" -srcfolder dmg-root -ov -format UDZO "$dmgname"
          shasum -a 256 "$zipname" > "$zipname.sha256"
          shasum -a 256 "$dmgname" > "$dmgname.sha256"

      - name: Upload Apple Silicon package
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-macOS-AppleSilicon-arm64
          path: |
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.zip
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.zip.sha256
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.dmg
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}
          compression-level: 0

  release:
    name: Publish three-platform release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, windows, windows-arm64-native, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download validated Windows x64 bundle
        uses: actions/download-artifact@v7
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Windows-x64
          path: package/windows-x64

      - name: Download validated Windows ARM64 bundle
        uses: actions/download-artifact@v7
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Windows-ARM64
          path: package/windows-arm64

      - name: Download validated macOS Apple Silicon package
        uses: actions/download-artifact@v7
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-macOS-AppleSilicon-arm64
          path: package/macos

      - name: Download validation evidence
        uses: actions/download-artifact@v7
        with:
          pattern: SParamView-v${{ needs.prepare.outputs.version }}-*-validation
          path: package/evidence

      - name: Package and publish verified new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py

          if ($v.ProductVersion -notmatch $expected) { throw "ProductVersion mismatch: $($v.ProductVersion)" }
          if ($v.FileVersion -notmatch $expected) { throw "FileVersion mismatch: $($v.FileVersion)" }
          if ($v.LegalCopyright -ne 'Copyright © 2026 july') { throw "LegalCopyright mismatch: $($v.LegalCopyright)" }

      - name: Run packaged ARM64 regression suite natively
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bundle = Join-Path $PWD 'bundle'
          $qa = Join-Path $env:RUNNER_TEMP ('native-arm64-v' + $env:SPARAMVIEW_VERSION)
          New-Item -ItemType Directory -Force $qa | Out-Null
          $env:PATH = $bundle + [IO.Path]::PathSeparator + $env:PATH
          $env:QT_PLUGIN_PATH = $bundle
          $env:QT_QPA_PLATFORM = 'offscreen'
          $log = Join-Path $qa 'results.txt'
          "SParamView v$env:SPARAMVIEW_VERSION native Windows ARM64 packaged-binary gate" | Set-Content $log
          function Invoke-Test {
            param([string]$Name, [string[]]$TestArgs = @())
            $exe = Join-Path $bundle ($Name + '.exe')
            if (-not (Test-Path $exe)) { throw "Missing test executable: $Name" }
            "--- $Name $($TestArgs -join ' ')" | Add-Content $log
            & $exe @TestArgs 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "$Name failed with exit code $LASTEXITCODE" }
          }
          foreach ($name in @('si_tests','si_v116_regression_tests','si_v121_regression_tests','si_algorithm_regression_tests','si_mapping_tests','si_mapping_policy_tests','si_polarity_tests','si_termination_tests','si_performance_tests','si_qt_tests','si_header_ui_tests')) {
            Invoke-Test -Name $name
          }
          foreach ($case in @('named','options','triangle','hash','numbers')) {
            Invoke-Test -Name 'si_v124_regression_tests' -TestArgs @($case)
          }
          foreach ($case in @('reuse','dirty','project_changed','single_review','mixed','transition','roundtrip')) {
            Invoke-Test -Name 'si_v124_gui_tests' -TestArgs @($case,(Join-Path $qa "v124-$case"))
          }
          Invoke-Test -Name 'si_direction_tests' -TestArgs @((Join-Path $qa 'direction'))
          Invoke-Test -Name 'si_golden_tests' -TestArgs @((Join-Path $qa 'golden'))
          foreach ($case in @('snapshot','cr_only','false_noise','valid_noise','empty_tdr','truncated_live_cache','invalid_cached_frequency','zero_transfer','cancel_reopen','parallel_import')) {
            Invoke-Test -Name 'si_hardening_tests' -TestArgs @($case,(Join-Path $qa "hardening\$case"))
          }
          Invoke-Test -Name 'si_navigation_tests' -TestArgs @((Join-Path $qa 'navigation'))
          Invoke-Test -Name 'si_open_tests' -TestArgs @((Join-Path $qa 'open'),'fallback')
          Invoke-Test -Name 'si_open_tests' -TestArgs @((Join-Path $qa 'signal-type'),'signaltype')
          Invoke-Test -Name 'si_workspace_tests' -TestArgs @((Join-Path $bundle 'examples\demo.siproject'),(Join-Path $qa 'workspace'),'1366','768')
          & (Join-Path $bundle 'SParamView.exe') --selftest (Join-Path $bundle 'examples') (Join-Path $qa 'workflow') 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "SParamView.exe --selftest failed with exit code $LASTEXITCODE" }
          'PASS' | Add-Content $log

      - name: Upload native ARM64 validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Native-Windows-ARM64-validation
          path: ${{ runner.temp }}/native-arm64-v${{ needs.prepare.outputs.version }}/
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}
          compression-level: 9

  macos-arm64:
    name: macOS Apple Silicon arm64
    needs: [prepare, quality]
    runs-on: macos-14
    timeout-minutes: 70
    env:
      QT_ROOT: ${{ github.workspace }}/Qt/6.8.3/macos
      MACOS_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/Qt/6.8.3
          key: qt-macos-arm64-${{ env.QT_VERSION }}-v1

      - name: Install Qt download tooling
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check aqtinstall==3.3.0

      - name: Install Qt for macOS
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "${{ github.workspace }}/Qt"

      - name: Configure Apple Silicon build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT/lib/cmake" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"

      - name: Build Apple Silicon binaries
        run: cmake --build build-macos --parallel 3

      - name: Verify application executable architecture
        shell: bash
        run: |
          set -euo pipefail
          arches="$(lipo -archs build-macos/SParamView)"
          echo "SParamView architectures: $arches"
          grep -qw arm64 <<<"$arches"
          if grep -qw x86_64 <<<"$arches"; then
            echo 'Unexpected x86_64 slice in Apple Silicon executable'
            exit 1
          fi

      - name: Run deterministic regression suite
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-macos --output-on-failure \
            -E 'workspace_layout|navigation_responsiveness|mapping_fallback_gui|signal_type_detection_gui'

      - name: Run macOS GUI integration tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=minimal build-macos/si_header_ui_tests
          QT_QPA_PLATFORM=minimal build-macos/si_navigation_tests build-macos/navigation-test-macos
          QT_QPA_PLATFORM=minimal build-macos/si_open_tests build-macos/open-test-macos fallback
          QT_QPA_PLATFORM=cocoa build-macos/si_workspace_tests examples/demo.siproject build-macos/workspace-test-macos 1440 900
          QT_QPA_PLATFORM=minimal build-macos/si_open_tests build-macos/signal-type-test-macos signaltype

      - name: Create macOS app bundle
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          app='package/SParamView.app'
          mkdir -p "$app/Contents/MacOS/fonts" "$app/Contents/Resources"
          cp build-macos/SParamView "$app/Contents/MacOS/SParamView"
          cp -R assets/fonts/. "$app/Contents/MacOS/fonts/"

          iconset="${RUNNER_TEMP}/SParamView.iconset"
          iconpng="${RUNNER_TEMP}/SParamView-icon.png"
          rm -rf "$iconset" "$iconpng"
          mkdir -p "$iconset"
          sips -s format png assets/SParamView.ico --out "$iconpng" >/dev/null
          sips -z 16 16 "$iconpng" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 "$iconpng" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$iconpng" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 "$iconpng" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$iconpng" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 "$iconpng" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$iconpng" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 "$iconpng" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$iconpng" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$iconpng" --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/SParamView.icns"
          test -s "$app/Contents/Resources/SParamView.icns"
          rm -rf "$iconset" "$iconpng"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleDisplayName</key><string>SParamView</string>
            <key>CFBundleExecutable</key><string>SParamView</string>
            <key>CFBundleIconFile</key><string>SParamView.icns</string>
            <key>CFBundleIdentifier</key><string>com.july.sparamview</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>SParamView</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.2.4</string>
            <key>CFBundleVersion</key><string>1.2.4.1</string>
            <key>SParamViewDisplayVersion</key><string>${SPARAMVIEW_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>${MACOS_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          "$QT_ROOT/bin/macdeployqt" "$app" -always-overwrite -verbose=2
          test -s "$app/Contents/Resources/SParamView.icns"
          test "$(plutil -extract CFBundleIconFile raw -o - "$app/Contents/Info.plist")" = 'SParamView.icns'

      - name: Thin and audit deployed Mach-O files to arm64
        shell: bash
        run: |
          set -euo pipefail
          app='package/SParamView.app'
          count=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              count=$((count + 1))
              arches="$(lipo -archs "$f")"
              if ! grep -qw arm64 <<<"$arches"; then
                echo "ERROR: missing arm64 slice: $f :: $arches"
                exit 1
              fi
              if grep -qw x86_64 <<<"$arches"; then
                lipo "$f" -thin arm64 -output "$f.arm64"
                mv "$f.arm64" "$f"
              fi
              final="$(lipo -archs "$f")"
              echo "$f :: $final"
              test "$final" = 'arm64'
            fi
          done < <(find "$app/Contents" -type f -print0)
          test "$count" -gt 0

      - name: Record macOS build provenance
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, plistlib
          app=pathlib.Path('package/SParamView.app/Contents')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']=='1.2.4'
          assert info['CFBundleVersion']=='1.2.4.1'
          assert info['SParamViewDisplayVersion']==os.environ['SPARAMVIEW_VERSION']
          (app/'Resources/build-provenance.json').write_text(json.dumps(dict(version=os.environ['SPARAMVIEW_VERSION'],commit=os.environ['GITHUB_SHA'],platform='macOS arm64',run_id=os.environ['GITHUB_RUN_ID'])))
          PYTHON

      - name: Ad-hoc sign and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          app='package/SParamView.app'
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Run packaged application self-test
        shell: bash
        env:
          QT_QPA_PLATFORM: minimal
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QT_ROOT }}/plugins/platforms
        run: |
          set -euo pipefail
          mkdir -p package/selftest
          package/SParamView.app/Contents/MacOS/SParamView --selftest examples package/selftest

      - name: Include release documentation in macOS bundle
        run: |
          mkdir -p package/SParamView.app/Contents/Resources/docs
          cp README_FIRST.txt package/SParamView.app/Contents/Resources/
          cp docs/USER_GUIDE_*.md docs/Release_${{ needs.prepare.outputs.version }}.md package/SParamView.app/Contents/Resources/docs/
          codesign --force --deep --sign - package/SParamView.app
          codesign --verify --deep --strict package/SParamView.app

      - name: Upload macOS test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-macOS-validation
          path: |
            build-macos/Testing/Temporary/*.log
            build-macos/workspace-test-macos/*.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}

      - name: Package Apple Silicon ZIP and DMG
        env:
          SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          zipname="SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.zip"
          dmgname="SParamView_macOS_AppleSilicon_arm64_v${SPARAMVIEW_VERSION}.dmg"
          ditto -c -k --sequesterRsrc --keepParent package/SParamView.app "$zipname"
          rm -rf dmg-root && mkdir dmg-root
          cp -R package/SParamView.app dmg-root/
          hdiutil create -volname "SParamView ${SPARAMVIEW_VERSION}" -srcfolder dmg-root -ov -format UDZO "$dmgname"
          shasum -a 256 "$zipname" > "$zipname.sha256"
          shasum -a 256 "$dmgname" > "$dmgname.sha256"

      - name: Upload Apple Silicon package
        uses: actions/upload-artifact@v6
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-macOS-AppleSilicon-arm64
          path: |
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.zip
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.zip.sha256
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.dmg
            SParamView_macOS_AppleSilicon_arm64_v${{ needs.prepare.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}
          compression-level: 0

  release:
    name: Publish three-platform release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, windows, windows-arm64-native, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SPARAMVIEW_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download validated Windows x64 bundle
        uses: actions/download-artifact@v7
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Windows-x64
          path: package/windows-x64

      - name: Download validated Windows ARM64 bundle
        uses: actions/download-artifact@v7
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-Windows-ARM64
          path: package/windows-arm64

      - name: Download validated macOS Apple Silicon package
        uses: actions/download-artifact@v7
        with:
          name: SParamView-v${{ needs.prepare.outputs.version }}-macOS-AppleSilicon-arm64
          path: package/macos

      - name: Download validation evidence
        uses: actions/download-artifact@v7
        with:
          pattern: SParamView-v${{ needs.prepare.outputs.version }}-*-validation
          path: package/evidence

      - name: Package and publish verified new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
