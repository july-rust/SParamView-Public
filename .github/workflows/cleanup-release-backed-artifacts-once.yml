name: Cleanup release-backed Actions artifacts once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-release-backed-artifacts-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete approved release-backed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            11289540867 11289381224 11289336035 11289206561 11289141836 11289051958
            11073037875 11072562526 11072398982 11072357881 11072193044 11072168111
            11073011183 11073010976 11072816736 11072772038 11072747123 11072014201
            11072870056 11072835062 11071254940
          )
          for id in "${ids[@]}"; do
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
          echo "Deleted ${#ids[@]} approved release-backed artifacts."
