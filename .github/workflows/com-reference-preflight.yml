name: COM reference provenance preflight (012_02)
on:
  pull_request:
    branches: [integration/v1.4.0]
    paths:
      - 'scripts/com_reference_preflight.py'
      - 'scripts/ieee_com_upstream_probe.py'
      - 'scripts/ieee_com_370_probe.py'
      - 'tests/channel_analysis/test_com_reference_preflight.py'
      - 'tests/fixtures/channel/com_reference/**'
      - '.github/workflows/com-reference-preflight.yml'
  push:
    branches: [integration/v1.4.0]
    paths:
      - 'scripts/com_reference_preflight.py'
      - 'scripts/ieee_com_upstream_probe.py'
      - 'scripts/ieee_com_370_probe.py'
      - 'tests/channel_analysis/test_com_reference_preflight.py'
      - 'tests/fixtures/channel/com_reference/**'
      - '.github/workflows/com-reference-preflight.yml'
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify schema and synthetic rejection cases (not IEEE COM numerical PASS)
        run: |
          python scripts/com_reference_preflight.py --mode schema --root tests/fixtures/channel/com_reference --manifest tests/fixtures/channel/com_reference/manifest.json
          python -m unittest discover -s tests/channel_analysis -p test_com_reference_preflight.py -v
      - name: Read-only IEEE GitLab metadata/license access probe (not qualification)
        if: always()
        run: |
          python scripts/ieee_com_upstream_probe.py | tee ieee-com-probe.json
      - name: Inspect IEEE 802.3ck COM 3.70 reference bundle
        if: always()
        shell: bash
        run: |
          python scripts/ieee_com_370_probe.py | tee ieee-com-370-inventory.json
      - name: Preserve COM 3.70 official package inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieee-com-370-archive-inventory
          path: ieee-com-370-inventory.json
          if-no-files-found: warn
      - name: Preserve upstream probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieee-com-upstream-access-012-02
          path: ieee-com-probe.json
          if-no-files-found: warn
