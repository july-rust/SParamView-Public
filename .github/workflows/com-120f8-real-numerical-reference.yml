name: 012_13 final 120F-8 real numerical reference qualification (bounded)
on:
  pull_request:
    branches: [integration/v1.4.0]
    paths:
      - 'scripts/com_120f8_reference_candidate.py'
      - 'tests/channel_analysis/test_com_120f8_reference_candidate.py'
      - '.github/workflows/com-120f8-real-numerical-reference.yml'
  push:
    branches: [integration/v1.4.0]
    paths:
      - 'scripts/com_120f8_reference_candidate.py'
      - 'tests/channel_analysis/test_com_120f8_reference_candidate.py'
      - '.github/workflows/com-120f8-real-numerical-reference.yml'
permissions:
  contents: read
jobs:
  source-verified-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install finite-source local test dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify deterministic 68-leaf and explicit draft aggressor contract
        run: python -m unittest discover -s tests/channel_analysis -p 'test_com_120f8_reference_candidate.py' -v
  run-real-c2c-reference-python:
    needs: source-verified-offline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: ['10']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tbermen/SiCoPR
          ref: cb7c4be5c63d41e88b6ee7d04fb17e0046ab0f75
          path: _external_qa_sicopr
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned independent reference only in ephemeral runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir './_external_qa_sicopr[plots]'
      - name: Compute true COM and FOM for both package cases with final numeric leaves
        shell: bash
        run: |
          set -euo pipefail
          timeout 2100s python scripts/com_120f8_reference_candidate.py \
            --mode python --channel '${{ matrix.channel }}' \
            --external _external_qa_sicopr \
            --output "01213-python-${{ matrix.channel }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 01213-final-parameters-draft-aggressors-python-${{ matrix.channel }}
          path: 01213-python-${{ matrix.channel }}.json
          if-no-files-found: warn
  run-real-c2c-reference-octave:
    needs: source-verified-offline
    runs-on: ubuntu-latest
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        channel: ['10']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tbermen/SiCoPR
          ref: cb7c4be5c63d41e88b6ee7d04fb17e0046ab0f75
          path: _external_qa_sicopr
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned independent Octave-compatible implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir './_external_qa_sicopr'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends octave gnuplot-nox
      - name: Compute independently via 4p17p0 Octave for both package cases
        shell: bash
        run: |
          set -euo pipefail
          timeout 2400s python scripts/com_120f8_reference_candidate.py \
            --mode octave --channel '${{ matrix.channel }}' \
            --external _external_qa_sicopr \
            --output "01213-octave-${{ matrix.channel }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 01213-final-parameters-draft-aggressors-octave-${{ matrix.channel }}
          path: 01213-octave-${{ matrix.channel }}.json
          if-no-files-found: warn
